<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MBR Dashboard</title>
<style>
:root{
  --navy:#0e2a47; --blue:#0067b9; --blue-soft:#e8f1fa;
  --ink:#1c2b3a; --muted:#5d6f82; --line:#e3e9f0;
  --bg:#eef1f6; --card:#ffffff; --amber:#e8a33d; --green:#1e9e6a; --red:#d64545;
  --radius:14px;
}
/* Contact status bars */
.mkt-group { margin: 14px 0 6px; }
.mkt-group .mkt { font-weight: 700; font-size: 13px; margin-bottom: 6px; }
.stat-row { display: flex; align-items: center; gap: 10px; margin: 4px 0; }
.stat-label { width: 190px; flex: none; font-size: 12.5px; color: var(--muted); text-align: right; }
.stat-bar-track { flex: 1; height: 22px; background: #eef1f6; border-radius: 6px; overflow: hidden; }
.stat-bar { height: 100%; border-radius: 6px; min-width: 3px; }
.stat-num { width: 55px; flex: none; font-size: 13px; font-weight: 700; color: var(--ink); }
.bar-legend { display: flex; gap: 18px; flex-wrap: wrap; margin: 14px 0 4px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.bar-legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;}
.wrap{max-width:1180px;margin:0 auto;padding:28px 22px 60px}
.periodbar{position:sticky;top:12px;z-index:50;background:var(--card);
  border-radius:var(--radius);box-shadow:0 4px 18px rgba(14,42,71,.14);
  padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.seg{display:flex;background:#eef1f6;border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:8px 18px;border-radius:8px;
  font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
.periodbar select{font-size:14px;font-weight:600;color:var(--navy);
  border:2px solid var(--line);border-radius:8px;padding:8px 12px;background:#fff;cursor:pointer}
.periodbar .hint{font-size:12px;color:var(--muted);margin-left:auto}
.hero{background:linear-gradient(135deg,#0e2a47 0%,#14406e 60%,#0067b9 100%);
  color:#fff;border-radius:var(--radius);padding:34px 36px;margin-bottom:22px;
  box-shadow:0 10px 30px rgba(14,42,71,.25)}
.hero .brand{font-size:12px;letter-spacing:2.5px;font-weight:700;color:#bcd6ee;margin-bottom:8px}
.hero h1{margin:0 0 6px;font-size:38px;font-weight:800;letter-spacing:-.5px}
.hero .period{font-size:15px;color:#d7e6f5}
.hero .sources{margin-top:10px;font-size:12px;color:#9db9d4}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:22px}
.kpi{background:var(--card);border-radius:var(--radius);padding:16px 14px;
  box-shadow:0 2px 10px rgba(14,42,71,.07);border-top:4px solid var(--blue)}
.kpi .label{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}
.kpi .value{font-size:26px;font-weight:800;margin-top:6px;color:var(--navy)}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:4px}
.card{background:var(--card);border-radius:var(--radius);padding:26px 28px;margin-bottom:22px;
  box-shadow:0 2px 10px rgba(14,42,71,.07)}
.card h2{margin:0 0 4px;font-size:20px;color:var(--navy);font-weight:800}
.card .lede{color:var(--muted);font-size:13px;margin-bottom:16px}
.eff{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--blue-soft);
  border-radius:10px;padding:16px 18px;margin:14px 0}
.eff .step{text-align:center}
.eff .step .t{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.eff .step .v{font-size:24px;font-weight:800;color:var(--navy)}
.eff .arrow{font-size:22px;color:var(--blue);font-weight:800}
.eff .win{background:var(--green);color:#fff;font-size:12px;font-weight:700;
  padding:6px 12px;border-radius:20px}
.take{border-left:4px solid var(--amber);background:#fffaf0;border-radius:0 10px 10px 0;
  padding:14px 18px;margin:12px 0;font-size:14px;line-height:1.55}
.take strong{color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
  padding:10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.total td{font-weight:800;background:#f4f8fc;border-top:2px solid var(--blue)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.pill.good{background:#e3f5ec;color:#147a4d}
.pill.warn{background:#fdf1dd;color:#9a6210}
.pill.na{background:#eef1f6;color:#8a97a5}
.bar-row{display:flex;align-items:center;gap:12px;margin:10px 0}
.bar-row .mkt{width:130px;font-weight:700;font-size:13px;color:var(--navy);flex:none}
.bar-track{flex:1;display:flex;height:26px;border-radius:7px;overflow:hidden;background:#eef1f6}
.bar-seg{height:100%}
.bar-vals{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 0 14px 142px}
.bar-vals .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
